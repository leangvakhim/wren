# Builds Wren for macOS (Apple Silicon + Intel), Windows and Linux, and puts
# the installers (plus latest.json and signatures for in-app updates) on a
# DRAFT GitHub release. Review the draft, then press
# "Publish release" on GitHub to make it public.
#
# Start it by pushing a version tag that matches tauri.conf.json, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# or run it by hand: GitHub → Actions → "release" → Run workflow.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon Macs (M1 and newer)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Macs
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # .deb, .rpm and .AppImage
            args: ''
          - platform: 'windows-latest' # .msi and setup .exe
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # The release is named after the version in tauri.conf.json, not the tag.
      # A tag like v0.1.3 on a commit that still says 0.1.1 would build 0.1.1
      # again, so stop early unless the tag and all three version files agree.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag $tag · tauri.conf.json $conf · package.json $pkg · Cargo.toml $cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag doesn't match the version in the files. Set the version to $tag in src-tauri/tauri.conf.json, package.json and src-tauri/Cargo.toml, commit, then tag that commit."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the Mac runners need the extra targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend packages
        run: npm ci

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies of Wren accept them
          # (repo Settings → Secrets and variables → Actions).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # replaced with the version in tauri.conf.json
          releaseName: 'Wren v__VERSION__'
          releaseBody: |
            Download the file for your computer:
            - **macOS (Apple Silicon, M1 and newer):** `Wren_*_aarch64.dmg`
            - **macOS (Intel):** `Wren_*_x64.dmg`
            - **Windows:** `Wren_*_x64-setup.exe` (or the `.msi`)
            - **Linux:** `.AppImage` (any distro), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora)

            Wren uses the official AI CLIs. Install the ones you want first:
            Claude Code (`claude`), Codex (`codex`) and/or Antigravity (`agy`).

            **macOS first launch:** this build isn't notarized by Apple. If macOS
            says it can't be opened, go to System Settings → Privacy & Security
            and click "Open Anyway" (once).
            **Windows first launch:** if SmartScreen appears, click
            "More info" → "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
